<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seblak Prasmanan Lia - Belendung | Pedesnya Nampol</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--merah:#D91424;--kuning:#FFC300;--hitam:#1a1a1a;--putih:#FFF8F0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--putih);color:var(--hitam)}
h1,h2,h3{font-family:'Poppins',sans-serif}
.header{background:var(--merah);color:white;padding:12px 16px;position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:18px}
.badge{background:var(--kuning);color:var(--hitam);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.hero{padding:24px 16px;background:linear-gradient(180deg, #fff 0%, #FFF0D6 100%);text-align:center;border-bottom:3px dashed var(--merah)}
.hero h1{font-size:28px;line-height:1.1;color:var(--merah)}
.hero p{margin-top:8px;color:#555;font-size:14px}
.menu{padding:16px;display:grid;gap:12px}
.card{background:white;border:2px solid #222;border-radius:16px;padding:12px;display:flex;gap:12px;box-shadow:4px 4px 0 #222}
.card img{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#eee}
.card-info{flex:1}
.card-info h3{font-size:16px}
.card-info p{font-size:12px;color:#666;margin:2px 0 8px}
.price{font-weight:700;color:var(--merah)}
.btn-tambah{border:2px solid #222;background:var(--kuning);border-radius:10px;padding:6px 14px;font-weight:700;box-shadow:2px 2px 0 #222}
.cart{position:fixed;bottom:0;left:0;right:0;background:white;border-top:3px solid #222;padding:12px 16px;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.1)}
.cart-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.btn-wa{width:100%;background:var(--merah);color:white;border:2px solid #222;border-radius:12px;padding:14px;font-size:16px;font-weight:700;box-shadow:3px 3px 0 #222}
.small{font-size:11px;color:#777;text-align:center;margin-top:8px}
</style>
</head>
<body>

<div class="header">
<b>SEBLAK LIA.</b>
<span class="badge">BUKA • BELENDUNG</span>
</div>

<div class="hero">
<h1>PEDESNYA<br>NAMPOL BOS!</h1>
<p>Seblak Prasmanan Asli Benda, Tangerang. Porsi Kuli, Harga Santri.<br><b>Lokasi: Belendung RT 03 - Buka 10:00-21:00</b></p>
</div>

<div class="menu" id="menuList">
<!-- GANTI FOTO & HARGA DISINI AJA -->
</div>

<div class="cart">
<div class="cart-top">
<span id="totalItem">0 Item</span>
<span id="totalHarga">Rp 0</span>
</div>
<button class="btn-wa" onclick="pesanWA()">PESAN VIA WHATSAPP →</button>
<div class="small">Ganti No WA di kode: cari 085697287693 | Ganti foto di postimages.org</div>
</div>

<script>
const WA_NUMBER = "6285697287693"; // GANTI NOMOR WA DISINI
const menus = [
  {nama:"Seblak Original", harga:10000, desc:"Kerupuk + Mie + Sawi", foto:"https://i.imgur.com/8Km9tLL.jpg"},
  {nama:"Seblak Ceker (3)", harga:15000, desc:"Paling laku! Ceker empuk", foto:"https://i.imgur.com/QkJv1zW.jpg"},
  {nama:"Seblak Komplit", harga:18000, desc:"Ceker, Bakso, Sosis, Telur", foto:"https://i.imgur.com/8Km9tLL.jpg"},
  {nama:"Topping Bakso (3)", harga:5000, desc:"Bakso sapi", foto:"https://i.imgur.com/QkJv1zW.jpg"},
  {nama:"Topping Sosis", harga:3000, desc:"Sosis ayam", foto:"https://i.imgur.com/QkJv1zW.jpg"},
];
let cart = [];
const list = document.getElementById('menuList');
menus.forEach((m,i)=>{
  list.innerHTML += `<div class="card">
    <img src="${m.foto}" onerror="this.src='https://via.placeholder.com/80'">
    <div class="card-info">
      <h3>${m.nama}</h3>
      <p>${m.desc}</p>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="price">Rp ${m.harga.toLocaleString('id-ID')}</span>
        <button class="btn-tambah" onclick="tambah(${i})">+ Tambah</button>
      </div>
    </div>
  </div>`;
});
function tambah(i){
  cart.push(menus[i]);
  updateCart();
}
function updateCart(){
  let total = cart.reduce((a,b)=>a+b.harga,0);
  document.getElementById('totalItem').innerText = cart.length + " Item";
  document.getElementById('totalHarga').innerText = "Rp " + total.toLocaleString('id-ID');
}
function pesanWA(){
  if(cart.length==0){alert("Pilih seblak dulu bos!");return}
  let total = cart.reduce((a,b)=>a+b.harga,0);
  let pesan = `Halo LiaMart, saya mau pesan:%0A`;
  cart.forEach(c=>{pesan+=`- ${c.nama} (Rp ${c.harga})%0A`});
  pesan+=`%0ATotal: Rp ${total}%0ALokasi saya: (share loc)`;
  window.open(`https://wa.me/${WA_NUMBER}?text=${pesan}`,'_blank');
}
</script>
</body>
</html>
